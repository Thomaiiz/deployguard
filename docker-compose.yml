# Sobe o DeployGuard completo: PostgreSQL + API + dashboard + uma aplicação de demonstração.
# Uso: cp .env.example .env  (e troque as senhas e a chave)  →  docker compose up --build
name: deployguard

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deployguard
      POSTGRES_USER: deployguard
      # ":?" faz o compose falhar se a variável não estiver definida: nada de senha padrão.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployguard -d deployguard"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    # Sem "ports": o banco só é acessível pela rede interna do compose.

  api:
    build: ./backend
    # Duas cópias da API atrás do nginx, dividindo o trabalho pelo banco (veja o README,
    # "Várias instâncias"). O nginx distribui as requisições entre elas.
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DeployGuard: Host=db;Database=deployguard;Username=deployguard;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      # Allowlist de destinos. Ajuste no .env para os hosts que você quer monitorar.
      Monitoring__AllowedHosts__0: ${MONITORING_ALLOWED_HOST_0:-*.github.com}
      Monitoring__AllowedHosts__1: ${MONITORING_ALLOWED_HOST_1:-github.com}
      Monitoring__AllowedHosts__2: ${MONITORING_ALLOWED_HOST_2:-example.com}
      # Único destino privado autorizado: o serviço de demonstração abaixo.
      Monitoring__AllowedPrivateHosts__0: demo-app
      Monitoring__AllowHttp: "true"
      Monitoring__AllowedPorts__0: "443"
      Monitoring__AllowedPorts__1: "8080"
      # Alertas: a URL do webhook é segredo e vem só do .env. Vazia = alertas desligados
      # (os incidentes continuam sendo registrados).
      Alerting__FailureThreshold: ${ALERT_FAILURE_THRESHOLD:-2}
      Alerting__DashboardBaseUrl: http://localhost:8080
      Alerting__Webhooks__0__Name: principal
      Alerting__Webhooks__0__Url: ${ALERT_WEBHOOK_URL:-}
      Alerting__Webhooks__0__Format: ${ALERT_WEBHOOK_FORMAT:-Slack}
      # Login: a chave que assina os tokens e a senha do primeiro admin são segredos do .env.
      # O admin só é criado quando o banco ainda não tem nenhum usuário.
      Auth__JwtSigningKey: ${AUTH_JWT_KEY:?defina AUTH_JWT_KEY no .env (openssl rand -base64 48)}
      Auth__BootstrapAdminEmail: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      Auth__BootstrapAdminPassword: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      # "Esqueci minha senha": o link do e-mail usa este endereço fixo (nunca o cabeçalho Host).
      PasswordReset__DashboardBaseUrl: ${DASHBOARD_URL:-http://localhost:8080}
      # E-mail: por padrão vai para o Mailpit abaixo (caixa de entrada de teste). Em produção,
      # aponte para um SMTP de verdade com TLS (SMTP_SECURITY=StartTls) e usuário/senha no .env.
      Email__SmtpHost: ${SMTP_HOST:-mailpit}
      Email__SmtpPort: ${SMTP_PORT:-1025}
      Email__Security: ${SMTP_SECURITY:-None}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM:-deployguard@localhost}
      # Rate limit global: as réplicas contam as requisições juntas no Redis. Se o Redis cair,
      # cada réplica volta a contar sozinha (a API não para).
      RateLimiting__Redis: redis:6379,password=${REDIS_PASSWORD}
      # Só confia em X-Forwarded-For vindo da rede interna (onde está o nginx).
      ReverseProxy__KnownNetworks__0: 172.28.0.0/24
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  # Contadores do rate limit compartilhados entre as réplicas da API. Só guarda contadores que
  # expiram em 1 minuto, então não precisa de disco (sem RDB nem AOF).
  redis:
    image: redis:8.6-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env (openssl rand -base64 32)}
    # "$$" escapa o "$" para o compose: quem expande a variável é o shell do container.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 64mb --maxmemory-policy volatile-ttl"]
    networks: [backend]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    # Sem "ports": só a API, na rede interna, fala com o Redis.

  web:
    build: ./frontend
    depends_on: [api]
    ports:
      - "127.0.0.1:8080:8080" # só a máquina local acessa o dashboard
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]

  # Caixa de entrada de teste: recebe todo e-mail que a API manda e mostra numa página.
  # Nada sai para a internet. Abra http://localhost:8025 para ver o link de "esqueci minha senha".
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:8025:8025" # interface web, só na máquina local
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  # Aplicação fictícia para ver o monitoramento funcionando sem depender da internet.
  demo-app:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    configs:
      - source: demo-nginx
        target: /etc/nginx/conf.d/default.conf
    networks: [backend]

configs:
  demo-nginx:
    content: |
      server {
        listen 8080;
        location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
        location = /slow   { return 200 'ok'; }
        location = /broken { return 503 'down'; }
        location / { return 404; }
      }

networks:
  backend:
  frontend:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  db-data:
