# nginx serve o Angular e faz proxy reverso de /api para o backend.
# O navegador só conhece uma origem, então a API não precisa de CORS
# e nem precisa ficar exposta fora da rede do Docker.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;            # não anuncia a versão do nginx
    client_max_body_size 32k;     # mesmo limite de corpo da API

    # Cabeçalhos de segurança para o navegador.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Substitui (não acumula) o X-Forwarded-For: o cliente não consegue forjar o IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location ~* \.(?:js|css|ico|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: qualquer rota desconhecida devolve o index.html e o Angular Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
