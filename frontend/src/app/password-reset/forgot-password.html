<section class="login">
  <div class="card form">
    <h1>Esqueci minha senha</h1>

    @if (sent(); as message) {
      <p class="notice" role="status" data-testid="forgot-sent">{{ message }}</p>
      <p class="muted">Não chegou? Confira a caixa de spam. O link vale por pouco tempo.</p>
    } @else {
      <p class="muted">
        Informe o e-mail da sua conta. Vamos mandar um link para criar uma nova senha.
      </p>
      <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label>
          E-mail
          <input type="email" formControlName="email" autocomplete="username" />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <span class="field-error">Informe um e-mail válido.</span>
          }
        </label>

        @if (error(); as message) {
          <p class="alert" role="alert">{{ message }}</p>
        }

        <button type="submit" class="btn" [disabled]="submitting()">
          {{ submitting() ? 'Enviando…' : 'Enviar link' }}
        </button>
      </form>
    }

    <a routerLink="/login" class="form__link">Voltar para o login</a>
  </div>
</section>
