<header class="topbar">
  <a routerLink="/" class="brand">
    <span class="brand__mark" aria-hidden="true">◆</span> DeployGuard
  </a>
  <span class="topbar__tag">Monitoramento de aplicações</span>
  @if (auth.user(); as user) {
    <nav class="topbar__user">
      <a routerLink="/status">Status</a>
      @if (auth.isAdmin()) {
        <a routerLink="/users">Usuários</a>
        <a routerLink="/keys">Chaves de API</a>
        <a routerLink="/audit">Auditoria</a>
      }
      <a routerLink="/account" class="muted" data-testid="current-user" title="Minha conta"
        >{{ user.email }} · {{ user.role }}</a
      >
      <button type="button" class="btn btn--ghost" (click)="logout()">Sair</button>
    </nav>
  }
</header>
<main class="container">
  <router-outlet />
</main>
