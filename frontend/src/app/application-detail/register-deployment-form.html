<form class="form form--inline" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label>
    Versão
    <input type="text" formControlName="version" placeholder="v1.4.2" autocomplete="off" />
    @for (message of serverErrors()['version'] ?? []; track message) {
      <span class="field-error">{{ message }}</span>
    }
  </label>
  <label>
    Commit (opcional)
    <input type="text" formControlName="commitSha" placeholder="a1b2c3d" autocomplete="off" />
    @if (form.controls.commitSha.invalid && form.controls.commitSha.touched) {
      <span class="field-error">De 7 a 40 caracteres hexadecimais.</span>
    }
  </label>
  <label>
    Descrição (opcional)
    <input type="text" formControlName="description" autocomplete="off" />
  </label>
  @if (generalError(); as error) {
    <p class="alert" role="alert">{{ error }}</p>
  }
  <button type="submit" class="btn" [disabled]="submitting()">
    {{ submitting() ? 'Salvando…' : 'Registrar deploy' }}
  </button>
</form>
