<section class="login">
  <form class="card form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Entrar</h1>
    <p class="muted">Use a conta criada pelo administrador do DeployGuard.</p>

    <label>
      E-mail
      <input type="email" formControlName="email" autocomplete="username" />
    </label>

    <label>
      Senha
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error(); as message) {
      <p class="alert" role="alert">{{ message }}</p>
    }

    <button type="submit" class="btn" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
  <p class="muted login__status"><a routerLink="/status">Ver o status dos serviços</a></p>
</section>
